services:
  postgres-jarvis:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: jarvis
      POSTGRES_DB: jarvis_local
    ports:
      - "55433:5432"
    volumes:
      - jarvis-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis_local"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  jarvis-postgres-data:
