app:
  environment: local
  instance_id: personal-assistant-local
  default_user_id: local_user
  default_language: ru

api:
  host: 127.0.0.1
  port: 8080
  request_timeout_seconds: 180
  sse_heartbeat_seconds: 15

model_profiles:
  local_main:
    purpose: chat
    provider: local_openai_compatible
    enabled: true
    cloud: false
    model: qwen3-32b-instruct
    endpoint: http://inference-node:8000/v1
    timeout_seconds: 120
    max_input_tokens: 12000
    max_output_tokens: 2048
    temperature: 0.3
    supports_streaming: true

  local_structured:
    purpose: structured
    provider: local_openai_compatible
    enabled: true
    cloud: false
    model: qwen3-14b-instruct
    endpoint: http://inference-node:8000/v1
    timeout_seconds: 60
    max_input_tokens: 8000
    max_output_tokens: 1024
    temperature: 0.0
    structured_output:
      mode: json_schema_prompt
      validation: local
      validation_retry: 1

  local_embedding:
    purpose: embedding
    provider: local_embedding
    enabled: true
    cloud: false
    model: qwen3-embedding-0.6b
    endpoint: http://inference-node:8001
    dimension: 1024
    timeout_seconds: 30
    batch_size: 32
    retry: 1

  cloud_reasoning:
    purpose: reasoning
    provider: openai
    enabled: false
    cloud: true
    model: gpt-placeholder
    api_key_env: OPENAI_API_KEY

memory:
  allowed_types: [fact, preference, procedure, summary]
  namespaces:
    user.preferences:
      sensitivity: personal
      allowed_types: [preference]
      default_retrieval: true
    user.working_style:
      sensitivity: personal
      allowed_types: [preference, procedure, summary]
      default_retrieval: true
    project.personal_assistant:
      sensitivity: project
      allowed_types: [fact, procedure, summary]
      default_retrieval: when_active_project
    system.runtime_rules:
      sensitivity: project
      allowed_types: [fact, procedure]
      default_retrieval: always
    environment.inference_node:
      sensitivity: infra
      allowed_types: [fact, procedure, summary]
      default_retrieval: when_relevant
  retrieval:
    max_hits_total: 8
    max_hits_per_namespace: 4
    min_score: null
    include_statuses: [active]
    exclude_sensitivity: [secret]

context_assembly:
  full_prompt_logging: false
  sections:
    order:
      - system_identity
      - runtime_rules
      - user_preferences
      - working_style
      - project_or_environment_memory
      - recent_conversation
      - current_user_message
      - output_contract
  conversation_window:
    max_messages: 12
    source_limit: 1000
    max_tokens: 3000
    include_roles: [user, assistant]
    exclude_sensitivity: [secret]
    trimming_strategy: drop_oldest_first
  context_budget:
    max_input_tokens: 12000
    memory_tokens_max: 2500
    content_hits_max: 4
    recent_conversation_tokens_max: 6000

runtime_budgets:
  memory_augmented_answer:
    max_model_calls: 1
    max_tool_calls: 0
    max_wall_time_seconds: 180
    max_context_assembly_seconds: 10
    max_memory_retrieval_seconds: 5
    max_model_call_seconds: 120
    max_output_tokens: 2048
    allow_cloud: false
    allow_tools: false
    allow_autonomous_memory_write: false
  tool_react_loop:
    max_steps: 4
    max_model_calls: 4
    max_tool_calls: 2
    max_wall_time_seconds: 60
    max_context_assembly_seconds: 10
    max_memory_retrieval_seconds: 5
    max_model_call_seconds: 60
    max_output_tokens: 2048
    max_consecutive_failures: 1
    allow_cloud: false
    allow_tools: true
    allow_autonomous_memory_write: false

loop_selection:
  deterministic_fast_path_threshold: 0.9

policy:
  cloud_models_enabled: false
  tools_enabled: true
  autonomous_memory_write_enabled: false
  model_access:
    local:
      allow_sensitivity: [public, project, personal, infra]
      deny_sensitivity: [secret]
    cloud:
      enabled: false
      allow_sensitivity: []
      deny_sensitivity: [public, project, personal, infra, secret]
  memory_write:
    deny_sensitivity: [secret]
  context_inclusion:
    deny_sensitivity: [secret]

permissions:
  mode: developer_local
  modes:
    locked_down:
      tool.safe: allow
      content.retrieve: approval_required
      content.ingest: deny
      content.index: deny
      context.inspect: allow
      tool.shell.read: approval_required
      tool.system.read.process: approval_required
      tool.system.read.resources: approval_required
      tool.system.read.hardware: approval_required
      tool.system.read.network: approval_required
      tool.system.read.sensors: approval_required
      tool.shell.write: deny
      tool.shell.network: deny
      tool.shell.destructive: deny
      model.cloud: deny
    developer_local:
      tool.safe: allow
      content.retrieve: allow
      content.ingest: allow
      content.index: allow
      context.inspect: allow
      tool.shell.read: allow
      tool.system.read.process: allow
      tool.system.read.resources: allow
      tool.system.read.hardware: allow
      tool.system.read.network: allow
      tool.system.read.sensors: allow
      tool.shell.write: approval_required
      tool.shell.network: deny
      tool.shell.destructive: deny
      integration.telegram: approval_required
      model.cloud: deny
    automation:
      tool.safe: allow
      content.retrieve: allow
      content.ingest: allow
      content.index: allow
      context.inspect: allow
      tool.shell.read: allow
      tool.system.read.process: allow
      tool.system.read.resources: allow
      tool.system.read.hardware: allow
      tool.system.read.network: allow
      tool.system.read.sensors: allow
      tool.shell.write: approval_required
      task.schedule: approval_required
      task.background: approval_required
      memory.write: deny
      model.cloud: deny

capabilities:
  tool.shell.read:
    allowed_roots: ["."]
    max_output_bytes: 20000
    timeout_seconds: 10
  tool.system.read:
    allowed_roots: ["."]
    enabled_families: [process, resources, hardware, network, sensors]
    max_output_bytes: 20000
    max_lines: 200
    timeout_seconds: 10

privacy:
  sensitivity_order: [public, project, personal, infra, secret]
  raw_prompt_logging: false
  raw_secret_logging: false
  store_context_manifest: true

observability:
  log_level: info
  structured_logs: true
  log_raw_messages: false
  log_raw_prompts: false
  log_model_outputs: false
  metrics_enabled: true
